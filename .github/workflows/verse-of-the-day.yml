name: Verse of the Day

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC; GitHub often starts it hours late. The bot posts the pick once it's pushed.
  workflow_dispatch:       # allow manual runs

jobs:
  post-verse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests Pillow

      # No DISCORD_WEBHOOK_URL: the bot posts the verse itself, under its own
      # name and avatar (webhook posts showed the webhook's identity instead).
      - name: Pick verse of the day
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5.5' }}
        run: python verse_of_the_day.py

      - name: Commit votd.json and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/votd.json data/votd_history.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update verse of the day"
          git push
